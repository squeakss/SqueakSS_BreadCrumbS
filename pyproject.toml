[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breadcrumbss"
version = "0.1.0"
description = "Incremental IP enrichment for Wireshark captures"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
breadcrumbss = "breadcrumbss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

